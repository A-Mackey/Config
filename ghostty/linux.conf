# Linux-only Ghostty settings. setup.sh links this to
# ~/.config/ghostty/platform.conf on Linux only, and the shared config includes
# that path optionally, so macOS never loads it (it keeps Cmd+T / Cmd+V).

# Browser-style tab and paste keys instead of the Ctrl+Shift defaults.
# Ghostty now consumes these, so apps in the terminal no longer receive them:
# in nvim use Ctrl+Q for Visual Block (Vim's built-in alias for Ctrl+V).
keybind = ctrl+t=new_tab
keybind = ctrl+v=paste_from_clipboard
