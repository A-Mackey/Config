# --- Prefix ---
# Unbind default prefix
unbind C-b

# Set prefix to Ctrl-Space
set -g prefix C-Space
bind C-Space send-prefix

# --- Pane navigation (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing without prefix (Alt + Shift + hjkl)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Pane navigation without prefix (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- Split panes ---
bind | split-window -h
bind - split-window -v

# Start windows and panes numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# --- Better defaults ---
set -g mouse on
set -g history-limit 10000

# --- Pane styling ---
# Subtle dimming on inactive panes; neon-purple border on the active pane.
# Inactive bg is ~5% darker than Nord's polar-night-0 (#2e3440).
set -g window-style 'fg=terminal,bg=#22252d'
set -g window-active-style 'fg=terminal,bg=terminal'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=#bf00ff,bold'
set -g pane-border-lines heavy

# Reduce escape delay for vim/tmux harmony
set -sg escape-time 0

# Allow neovim to access system clipboard through tmux
set -g set-clipboard on
set -g xterm-keys on
set -g update-environment "DISPLAY"

# Set default shell
set-option -g default-shell /bin/zsh

# --- Copy mode (vi-style) ---
set-window-option -g mode-keys vi

# Enter copy mode with prefix + v
bind v copy-mode

# In copy mode: v to start selection, prefix + y to copy to tmux buffer and system clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Scroll speed (default is 5)
bind -T copy-mode-vi WheelUpPane send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'nordtheme/tmux'

# Initialize TPM (keep at bottom of config)
run '~/.tmux/plugins/tpm/tpm'

