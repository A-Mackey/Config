# Main entry point — tmux only reads ~/.tmux.conf, so this just pulls in the
# split-out config files below (kept in ~/.tmux/conf.d, symlinked from this repo).
source-file ~/.tmux/conf.d/00-general.conf
source-file ~/.tmux/conf.d/10-panes.conf
source-file ~/.tmux/conf.d/20-clipboard.conf
source-file ~/.tmux/conf.d/30-statusbar.conf
source-file ~/.tmux/conf.d/40-plugins.conf
