# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'

# extrakto: fuzzy-extract text (URLs, paths, words) from the pane. Uses
# `capture-pane -J` under the hood, so URLs that tmux wrapped across multiple
# lines are rejoined before matching. Requires fzf.
#   prefix + Tab  -> open picker, then Ctrl-o opens the selection in the browser.
set -g @plugin 'laktak/extrakto'
set -g @extrakto_open_tool 'xdg-open'   # opens URLs in the default browser (Brave)
set -g @extrakto_filter_order 'url path word line'  # surface URLs first

# Initialize TPM (keep at bottom of config)
run '~/.tmux/plugins/tpm/tpm'
