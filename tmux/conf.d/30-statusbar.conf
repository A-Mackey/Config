# --- Status bar (Nord palette, muted purple accent to match pane borders) ---
set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-style 'bg=#2e3440,fg=#d8dee9'

set -g status-left-length 40
set -g status-right-length 100

# Session name pill
set -g status-left '#[fg=#2e3440,bg=#b48ead,bold]  #S #[fg=#b48ead,bg=#2e3440,nobold]'

# Active window: purple pill. Inactive windows: dim on the nord background.
set -g window-status-current-format '#[fg=#2e3440,bg=#b48ead,bold] #I:#W #[fg=#b48ead,bg=#2e3440,nobold]'
set -g window-status-format '#[fg=#4c566a,bg=#2e3440] #I:#W '
set -g window-status-separator ''

# Right side: live CPU/RAM/disk (via sysstats.sh, refreshed every status-interval),
# clock with seconds, hostname.
set -g status-right '#[fg=#4c566a]CPU #[fg=#a3be8c]#(~/.tmux/sysstats.sh cpu) #[fg=#4c566a]│ RAM #[fg=#ebcb8b]#(~/.tmux/sysstats.sh ram) #[fg=#4c566a]│ DISK #[fg=#88c0d0]#(~/.tmux/sysstats.sh disk) #[fg=#4c566a]│  #[fg=#d8dee9]%a %H:%M:%S #[fg=#4c566a]│ #[fg=#b48ead,bold] #h '
