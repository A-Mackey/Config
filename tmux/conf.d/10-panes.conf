# --- Pane navigation (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing without prefix (Alt + Shift + hjkl)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Pane navigation without prefix (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- Split panes ---
bind | split-window -h
bind - split-window -v

# --- Pane styling ---
# Subtle dimming on inactive panes; muted purple border on the active pane.
# Inactive bg is ~5% darker than Nord's polar-night-0 (#2e3440).
set -g window-style 'fg=terminal,bg=#22252d'
set -g window-active-style 'fg=terminal,bg=terminal'
set -g pane-border-style 'fg=#3b4252'
set -g pane-active-border-style 'fg=#b48ead,bold'
set -g pane-border-lines heavy

# Pane border labels (uses pane-border-style / pane-active-border-style above).
# Only show the border stripe once a window actually has more than one pane.
set -g pane-border-status off
set -g pane-border-format ' #{pane_index} #{pane_current_command} '
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'
