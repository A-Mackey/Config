# Clipboard: let xclip be the ONLY writer of the system clipboard so our
# sanitizing filter (see copy bindings below) can't be bypassed. With
# set-clipboard on, tmux also pushed the RAW selection to the clipboard via an
# OSC 52 escape, which defeated the filter (especially on mouse drag). Neovim
# reaches the clipboard through xclip directly (clipboard=unnamedplus), so it is
# unaffected by this.
set -g set-clipboard off
set -g xterm-keys on
set -g update-environment "DISPLAY"

# --- Copy mode (vi-style) ---
set-window-option -g mode-keys vi

# Enter copy mode with prefix + v
bind v copy-mode

# Every copy path pipes through clipboard-filter.pl, which strips characters
# that crash/corrupt other apps on paste (control chars, Private Use Area glyphs
# from Powerlevel10k, zero-width and bidi controls) before reaching xclip.

# v to start selection, y to copy and leave copy mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "~/.tmux/clipboard-filter.pl | xclip -selection clipboard"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.tmux/clipboard-filter.pl | xclip -selection clipboard"
# Mouse drag: copy on release but keep the selection (don't exit copy mode).
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "~/.tmux/clipboard-filter.pl | xclip -selection clipboard"

# Double/triple click select a word/line and copy it through the same filter.
# These mirror tmux's built-in bindings, only swapping in the filtered command.
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "~/.tmux/clipboard-filter.pl | xclip -selection clipboard"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "~/.tmux/clipboard-filter.pl | xclip -selection clipboard"
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "~/.tmux/clipboard-filter.pl | xclip -selection clipboard" }
bind -n TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "~/.tmux/clipboard-filter.pl | xclip -selection clipboard" }

# Scroll speed (default is 5). Kept at 1 line/tick so the view moves in small,
# easy-to-track steps instead of jumping — pair with Ghostty's
# mouse-scroll-multiplier (ghostty/config) for the same effect outside tmux.
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down
